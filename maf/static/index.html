<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAF Flow Studio</title>
<style nonce="__MAF_TOKEN__">
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#fff;font-size:15px}
*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{cursor:wait;opacity:.55}
.top{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;border-bottom:1px solid #dce4f0;gap:16px}
.brand{font-size:20px;font-weight:700;letter-spacing:-.04em}.project{color:#536174;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app{display:grid;grid-template-columns:238px minmax(0,1fr);min-height:calc(100vh - 64px)}aside{border-right:1px solid #dce4f0;background:#f8fbff;padding:28px 14px}
.side-title{font-size:13px;color:#657389;font-weight:700;text-transform:uppercase;letter-spacing:.09em;margin:0 14px 18px}.flow-list{display:grid;gap:4px}
.flow-item,.side-action{display:block;width:100%;border:0;background:transparent;color:#26364d;text-align:left;border-radius:7px;padding:11px 14px;font-size:15px}
.flow-item:hover,.side-action:hover{background:#eaf1fc}.flow-item.current{background:#e4efff;color:#154bb3;font-weight:650}.flow-item.active::after{content:"●";float:right;font-size:9px;margin-top:4px}
.side-action{margin-top:12px;border-top:1px solid #dce4f0;border-radius:0;padding-top:18px}
main{padding:32px min(4vw,60px) 64px;min-width:0;max-width:1560px;width:100%;margin:auto}.heading{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:18px}
h1{font-size:32px;line-height:1.15;letter-spacing:-.05em;margin:0}h2{font-size:18px;letter-spacing:-.025em;margin:0 0 16px}.muted{color:#627087}.status{font-size:13px;color:#536174;text-align:right}
.field-label{display:block;color:#34455e;font-size:13px;font-weight:650;margin-bottom:7px}.name-input,.description,.model-input,.effort-select{border:1px solid #cbd6e6;border-radius:6px;background:white;color:#172033;outline:none}
.name-input:focus,.description:focus,.model-input:focus,.effort-select:focus{border-color:#2863d3;box-shadow:0 0 0 3px #dfeaff}.name-input{font-size:27px;font-weight:700;letter-spacing:-.04em;padding:7px 10px;width:min(100%,500px)}
.description{display:block;resize:vertical;width:100%;min-height:74px;padding:12px;line-height:1.5}.actions{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin:18px 0 8px}
.primary,.secondary{border-radius:6px;padding:10px 18px;font-weight:650;font-size:14px}.primary{background:#2457c5;border:1px solid #2457c5;color:#fff}.primary:hover{background:#1647b3}.secondary{background:#fff;border:1px solid #cbd6e6;color:#243755}.secondary:hover{background:#f5f8fd}
.explain{color:#5a6980;line-height:1.5;margin:8px 0 30px;font-size:14px}section{border-top:1px solid #dce4f0;padding-top:24px;margin-top:24px}
.role-head{display:grid;grid-template-columns:minmax(150px,1fr) minmax(220px,1.15fr) minmax(150px,.6fr);gap:20px;padding:0 0 7px;color:#66748a;font-size:12px;font-weight:650;text-transform:uppercase;letter-spacing:.06em}
.role-row{display:grid;grid-template-columns:minmax(150px,1fr) minmax(220px,1.15fr) minmax(150px,.6fr);align-items:center;gap:20px;padding:12px 0;border-bottom:1px solid #e2e8f1}
.main-row{display:grid;grid-template-columns:minmax(220px,1fr) minmax(150px,.6fr) auto auto;gap:10px;align-items:end}.main-row label{min-width:0}
.role-name{font-weight:650}.role-route{font-size:12px;color:#728096;margin-top:4px}.model-input,.effort-select{width:100%;height:40px;padding:8px 11px;font-size:14px}
.check{display:flex;align-items:center;gap:10px;margin-top:20px;color:#34455e;font-size:14px}.check input{width:16px;height:16px;accent-color:#2457c5}
.table-wrap{overflow-x:auto;border:1px solid #dce4f0;border-radius:6px}table{border-collapse:collapse;width:100%;min-width:690px;font-size:13px}th,td{padding:11px 12px;text-align:left;border-bottom:1px solid #e6ebf3}tr:last-child td{border-bottom:0}th{background:#f7f9fd;color:#536174;font-weight:650}td.sha{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;color:#485c78}.attention{color:#a33f24}
.empty{color:#728096;padding:20px 12px}.meta{margin-top:20px;font-size:12px;color:#758299;line-height:1.5}.notice{min-height:20px;font-size:13px;color:#16613c}.notice.error{color:#a33f24}
@media(max-width:760px){.top{height:auto;min-height:58px;padding:12px 18px}.project{max-width:45%;text-align:right}.app{display:block;min-height:0}aside{border-right:0;border-bottom:1px solid #dce4f0;padding:10px 16px}.side-title{display:none}.flow-list{display:flex;overflow-x:auto}.flow-item{width:auto;white-space:nowrap}.side-action{display:inline-block;width:auto;margin:0;border:0;padding:11px 14px}.heading{display:block}h1{font-size:27px}.status{text-align:left;margin-top:12px}main{padding:24px 18px 50px}.role-head{display:none}.role-row{grid-template-columns:1fr 1fr;gap:10px}.role-row>div:first-child{grid-column:1/-1}.main-row{grid-template-columns:1fr 1fr}.main-row label:first-child{grid-column:1/-1}.model-input,.effort-select{min-width:0}.actions{gap:8px}.primary,.secondary{padding:10px 12px}}
@media(prefers-reduced-motion:no-preference){button{transition:background .15s ease}}
</style>
<header class="top"><div class="brand">Flow Studio</div><div class="project" id="project">本機專案</div></header>
<div class="app">
  <aside><p class="side-title">Flows</p><nav class="flow-list" id="flow-list" aria-label="Flow 清單"></nav><button class="side-action" id="new-flow" type="button">＋ 新增 flow</button></aside>
  <main>
    <div class="heading"><div><label class="field-label" for="flow-name">Flow 名稱</label><input class="name-input" id="flow-name" autocomplete="off" spellcheck="false" maxlength="40" aria-label="Flow 名稱"></div><div class="status" id="selection"></div></div>
    <label class="field-label" for="description">說明</label><textarea class="description" id="description" maxlength="200"></textarea>
    <div class="actions"><button class="primary" id="use-flow" type="button">儲存並使用</button><button class="secondary" id="save-flow" type="button">只儲存</button><button class="secondary" id="export-flow" type="button">匯出 JSON</button><button class="secondary" id="import-flow" type="button">匯入 JSON</button><input id="import-file" type="file" accept="application/json,.json" hidden></div>
    <div class="notice" id="notice" role="status" aria-live="polite"></div>
    <p class="explain">Claude 留在目前對話中工作；只有手動輸入 <code>/maf-plan</code> 才會呼叫規畫者。下方 Agent 設定用於之後啟動的 MAF agent；上方偏好可複製成 Claude 指令，貼到目前對話切換。</p>
    <section aria-labelledby="main-title"><h2 id="main-title">目前 Claude 對話</h2><div class="main-row"><label><span class="field-label">Model</span><input class="model-input" id="main-model" aria-label="Claude model" spellcheck="false"></label><label><span class="field-label">Effort</span><select class="effort-select" id="main-effort" aria-label="Claude effort"><option>low</option><option>medium</option><option>high</option></select></label><button class="secondary" id="copy-model" type="button">複製 /model</button><button class="secondary" id="copy-effort" type="button">複製 /effort</button></div></section>
    <section aria-labelledby="agent-title"><h2 id="agent-title">Agent 設定</h2><div class="role-head"><span>角色</span><span>Model</span><span>Effort</span></div>
      <div class="role-row" data-role="planner"><div><div class="role-name">Codex 規畫</div><div class="role-route"></div></div><input class="model-input" aria-label="規畫 model" spellcheck="false"><select class="effort-select" aria-label="規畫 effort"><option>low</option><option>medium</option><option>high</option></select></div>
      <div class="role-row" data-role="coder"><div><div class="role-name">Pi 小任務</div><div class="role-route"></div></div><input class="model-input" aria-label="Pi model" spellcheck="false"><select class="effort-select" aria-label="Pi effort"><option>low</option><option>medium</option><option>high</option></select></div>
      <div class="role-row" data-role="reviewer"><div><div class="role-name">獨立 Review</div><div class="role-route"></div></div><input class="model-input" aria-label="Review model" spellcheck="false"><select class="effort-select" aria-label="Review effort"><option>low</option><option>medium</option><option>high</option></select></div>
      <label class="check"><input id="manual-plan" type="checkbox">此 flow 建議手動執行 /maf-plan</label>
    </section>
    <section aria-labelledby="runs-title"><div class="heading"><h2 id="runs-title">近期任務</h2><button class="secondary" id="refresh" type="button">重新整理</button></div><div class="table-wrap"><table><thead><tr><th>任務</th><th>階段</th><th>測試 SHA</th><th>Review SHA</th><th>狀態</th></tr></thead><tbody id="runs"></tbody></table></div><p class="meta" id="billing"></p></section>
  </main>
</div>
<script nonce="__MAF_TOKEN__">
const token="__MAF_TOKEN__";
const el=id=>document.getElementById(id);
let snapshot=null, currentName="", draft=null;
async function api(path, body){
  const response=await fetch(path,{method:body?"POST":"GET",headers:{"X-MAF-Token":token,...(body?{"Content-Type":"application/json"}:{})},body:body?JSON.stringify(body):undefined});
  const value=await response.json();
  if(!response.ok)throw Error(value.error||"操作失敗");
  return value;
}
function message(text,error=false){el("notice").textContent=text;el("notice").classList.toggle("error",error)}
function edit(name,flow){currentName=name;draft=structuredClone(flow);draw()}
function collect(){
  const name=el("flow-name").value.trim();
  const flow=structuredClone(draft);
  flow.description=el("description").value;
  flow.manual_plan=el("manual-plan").checked;
  flow.main.model=el("main-model").value.trim();flow.main.effort=el("main-effort").value;
  for(const row of document.querySelectorAll(".role-row")){
    const role=flow.roles[row.dataset.role];
    role.model=row.querySelector(".model-input").value.trim();
    role.effort=row.querySelector(".effort-select").value;
  }
  return {name,flow};
}
function draw(){
  el("project").textContent=snapshot.project+"  |  僅限本機";
  el("selection").textContent="目前使用："+snapshot.mode;
  const list=el("flow-list");list.replaceChildren();
  for(const name of Object.keys(snapshot.flows).sort()){
    const button=document.createElement("button");button.type="button";button.textContent=name;
    button.className="flow-item"+(name===currentName?" current":"")+(name===snapshot.mode?" active":"");
    button.addEventListener("click",()=>edit(name,snapshot.flows[name]));list.append(button);
  }
  el("flow-name").value=currentName;el("description").value=draft.description;el("manual-plan").checked=draft.manual_plan;
  el("main-model").value=draft.main.model;el("main-effort").value=draft.main.effort;
  for(const row of document.querySelectorAll(".role-row")){
    const role=draft.roles[row.dataset.role];
    row.querySelector(".role-route").textContent=role.runtime+" / "+role.provider;
    row.querySelector(".model-input").value=role.model;
    row.querySelector(".effort-select").value=role.effort||"medium";
  }
  const tbody=el("runs");tbody.replaceChildren();
  const rows=[...snapshot.rows].sort((a,b)=>b.created-a.created).slice(0,8);
  if(!rows.length){const td=document.createElement("td");td.colSpan=5;td.className="empty";td.textContent="目前沒有任務。";const tr=document.createElement("tr");tr.append(td);tbody.append(tr)}
  for(const run of rows){
    const tr=document.createElement("tr");
    for(const [value,cls] of [[run.task,""],[run.stage,""],[run.tested,"sha"],[run.reviewed,"sha"],[run.status,run.attention?"attention":""]]){
      const td=document.createElement("td");td.textContent=value??"—";td.className=cls;tr.append(td);
    }
    if(run.next)tr.title=run.next;
    tbody.append(tr);
  }
  el("billing").textContent="訂閱路由："+snapshot.billing+"。設定只保存在此專案的私人 Git 狀態；切換不會更改目前 Claude 對話，也不會自動呼叫模型。";
}
async function refresh(){snapshot=await api("/api/state");if(!draft||!snapshot.flows[currentName]){currentName=snapshot.flows[snapshot.mode]?snapshot.mode:"quick";draft=structuredClone(snapshot.flows[currentName])}draw()}
async function save(use){
  const {name,flow}=collect();
  try{
    snapshot=await api("/api/flow",{name,flow});currentName=name;draft=structuredClone(flow);
    if(use)snapshot=await api("/api/mode",{name});
    draw();message(use?"已儲存，後續任務會使用此 flow。":"Flow 已儲存。",false);
  }catch(error){message(error.message,true)}
}
el("save-flow").addEventListener("click",()=>save(false));el("use-flow").addEventListener("click",()=>save(true));
el("new-flow").addEventListener("click",()=>{edit("",draft);el("flow-name").focus();message("輸入新名稱後儲存。")});
el("refresh").addEventListener("click",()=>refresh().catch(error=>message(error.message,true)));
el("export-flow").addEventListener("click",()=>{
  const value=collect();const blob=new Blob([JSON.stringify(value,null,2)+"\n"],{type:"application/json"});const url=URL.createObjectURL(blob);
  const link=document.createElement("a");link.href=url;link.download=(value.name||"maf-flow")+".json";link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
});
el("import-flow").addEventListener("click",()=>el("import-file").click());
for(const [button,command,input] of [["copy-model","/model ","main-model"],["copy-effort","/effort ","main-effort"]]){
  el(button).addEventListener("click",async()=>{try{await navigator.clipboard.writeText(command+el(input).value.trim());message("已複製，請貼到目前 Claude 對話。")}catch(error){message("無法使用剪貼簿；請直接在 Claude 輸入 "+command+el(input).value.trim(),true)}});
}
el("import-file").addEventListener("change",async event=>{
  const file=event.target.files[0];if(!file)return;
  try{if(file.size>65536)throw Error("JSON 檔案太大。");const value=JSON.parse(await file.text());
    if(!value.name||!value.flow?.main||!value.flow?.roles?.planner||!value.flow?.roles?.coder||!value.flow?.roles?.reviewer)throw Error("JSON 缺少 name、main 或 roles。");edit(value.name,value.flow);message("已載入，請檢查後儲存。")
  }catch(error){message(error.message,true)}event.target.value="";
});
refresh().catch(error=>message(error.message,true));
</script>
</html>
